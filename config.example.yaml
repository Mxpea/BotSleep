# Copy to config.yaml. Priority: --username > MC_AGENT_* environment > YAML > defaults.
# main.py also accepts --config or BOTSLEEP_CONFIG to select this file.
mc_api:
  base_url: "http://127.0.0.1:18900/api/v1"  # MC_AGENT_API
  timeout_seconds: 15
  login_timeout_seconds: 30

agent:
  name: "SleepBot"                         # MC_AGENT_USER or --username
  password: ""                            # Prefer MC_AGENT_PASSWORD; empty for no-password offline servers.
  mode: "sleep"                           # sleep or survival; --mode overrides this.

survival:
  intent: survival                         # survival or speedrun; phase hints never enable unbound actions.
  objective: "starter"                     # starter, daily, competition (requires llm.enabled; no chat debug).
  operator_goal: ""                        # Optional current user goal (<=1000 visible characters); safety still wins.
  autonomy:                               # Daily/competition: one model goal, locally verified child steps.
    enabled: true                         # False retains atomic model tools; no new long task may start.
    max_steps: 128                        # Per task; 1..2048. Overall run/death budgets still apply.
    max_seconds: 600                      # Per task; finite positive seconds, at most 3600.
    max_local_failures: 4                 # 1..32 before returning a real failure summary for replanning.
    max_no_progress_steps: 8              # 1..128; waits/no-ops do not prove progress.
    max_explore_steps: 8                  # 0..64; zero disables task exploration.
  competition:
    # Conditions in the draft are NOT enabled automatically. Set final-table IDs explicitly.
    eligibility_overrides: {}              # e.g. minecraft:story/follow_ender_eye: true (only if final rules score it).
    defer_seconds: 300                    # Force-exited goals cannot be immediately reselected.
    advancement_poll_seconds: 5
    max_seconds: 28800                    # Persisted competition session budget, not an official match clock.
    max_steps: 100000                     # Separate from starter/daily development step budget.
  daily:
    food_reserve: 8                         # Target inventory item counts, not saturation guarantees.
    wood_reserve: 8
    fuel_reserve: 8
    maintenance_interval_seconds: 30
  world_id: "default"                      # Change this when replacing a server world.
  state_dir: "runtime/survival"             # Checkpoints scoped by API, username and world_id.
  scan_radius: 24
  poll_interval_seconds: 1
  retry_seconds: 5
  max_steps: 256
  max_runtime_seconds: 3600
  max_target_failures: 2
  target_cooldown_seconds: 300
  max_consecutive_failures: 6
  max_deaths: 3
  explore_distance: 16
  max_explore_steps: 8
  low_health_threshold: 8
  food_threshold: 16
  threat_radius: 8

sleep:
  enabled: true
  radius: 16                              # Integer, 1-64 blocks.
  threat_check: true
  threat_distance: 8
  poll_interval_seconds: 0.5
  retry_seconds: 15
  timeout_seconds: 600
  move_timeout_seconds: 15
  confirm_timeout_seconds: 5

debug:
  enable_in_game_commands: false           # Enable here or pass --debug; both require the player allowlist below.
  command_prefix: "#"
  allowed_usernames: []                    # Empty denies remote commands; list trusted player names explicitly.
  flight_recorder:
    enabled: true
    output_dir: "logs"                     # Relative to this YAML file, not the shell's current directory.
  monitor:
    enabled: false
    host: "127.0.0.1"                      # Loopback only; local read-only dashboard.
    port: 18930
    heartbeat_seconds: 2
    console: false                         # Also print redacted model/action JSON to stdout.

# Enable together with agent.mode: survival to use native model tool calls.
# No silent fallback to rules on model errors. Store real keys only in ignored config files.
llm:
  enabled: false
  base_url: "http://127.0.0.1:8000/v1"      # BOTSLEEP_LLM_BASE_URL
  api_key: ""                             # BOTSLEEP_LLM_API_KEY
  model: "qwen3.6-35b-a3b"                # BOTSLEEP_LLM_MODEL; use the provider's permitted route name.
  temperature: 0.3
  max_tokens: 2048
  timeout_seconds: 60
  max_history_turns: 10
  max_repair_attempts: 1
  tls_version: "auto"                     # Optional "1.2" for TLS negotiation compatibility; verification stays on.

# RCON is an optional development dependency, never used by the model runner.
rcon:
  enabled: false
  host: "127.0.0.1"
  port: 25575
  password: ""

# Parameters for the independent mining/cave workflows. These defaults do not
# register deep mining as a daily tool or enable automatic cave exploration.
mining:
  targets:
    iron: {count: 24, min_tool: "stone_pickaxe"}
    coal: {count: 16, min_tool: "wooden_pickaxe"}
  cave_policy:
    flood_max_cells: 160
    horizontal_radius: 12
    vertical_span: 10
    max_height: 10
    max_drop: 4
    max_water_blocks: 3
    small_bubble_max_air: 4
    min_mineshaft_markers: 3
    min_enter_torches: 0
    explore_radius: 48
    explore_max_visited: 600
    explore_timeout_seconds: 360.0
    torch_interval: 24
    max_vein_blocks: 16
    max_unsafe_retries: 3
    eye_scan_radius: 4.5
  home_thresholds:
    min_empty_slots: 3
    min_health: 12.0
    min_food: 10.0
    min_torches: 4
    min_blocks: 16
    min_pickaxe_durability_ratio: 0.10
    min_remaining_seconds: 30.0
